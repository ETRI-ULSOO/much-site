# 국내 특허 출원 6건 — 최종보고서 별첨 6(특허 취합 zip)의 출원 통지서·명세서를 2026-09-14에 실측해 옮겼습니다.
#
# 출원인은 여섯 건 모두 한국전자통신연구원입니다. 등록된 건은 없어 status는 전부 filed(출원)입니다.
# 국제 특허 2건은 아직 출원 전이므로 이 파일에도 싣지 않습니다 (최종보고서 75쪽에서만 확인).
#
# public: false 인 항목은 화면에 내보내지 않습니다 (Publications.astro가 거릅니다).
#   2025년에 출원한 3건(kr04·kr05·kr06)은 특허청 공개(출원 후 18개월) 전이라 노출 여부를
#   사용자 확인 뒤에 정합니다 (2026-09-14 기준 보류). 나머지 3건은 공개 시점이 지났습니다.
# inventors는 스키마에 없는 참고 항목이라 화면에는 나오지 않습니다 (발명자 이름만 적고 개인정보는 옮기지 않음).
#
# 파일 형태 (2026-09-11 4단계): 최상위가 항목 배열이며 scope 항목(domestic·international)으로 구분한다.
#   콘텐츠 컬렉션의 file 로더가 배열 항목의 id를 열쇠로 쓰기 때문이다.

- id: kr01
  scope: domestic
  status: filed
  application_no: 10-2023-0145066
  application_date: 2023-10-26
  inventors: [박찬우]
  ko: { title: "문화 유산 기반의 히스토리 애셋 뷰어를 구축하는 방법 및 시스템" }
  en: { title: "Method and System for Building Cultural Heritage-Based History Asset Viewer" }

