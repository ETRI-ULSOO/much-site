# 참여 기관 — 현행 사이트 Consortium 페이지와 종료평가 발표자료 슬라이드 2를 대조했습니다 (2026-09-11).
#
# role  ministry(주관 부처) · lead(주관 연구기관) · partner(참여 연구기관) · demand(수요처)
#
# 기관 주소는 선행 과제 CHIC 사이트 저장소에서 접속이 확인된 것만 옮겼습니다 (2026-08-13 확인).
# url이 비어 있는 기관은 3단계에서 주소를 확인한 뒤에 채웁니다.
#
# 미해결 (2026-09-11 기준):
#   현행 사이트의 수상 페이지는 공동연구기관으로 TRIC(문화유산기술연구소)을 적고 있으나
#   컨소시엄 페이지에는 TRIC이 없습니다. 실제로 MUCH 과제에 참여했는지 사용자에게 확인해야 합니다.
#   확인되기 전까지 이 파일에 TRIC을 넣지 않았습니다.
#
# 연구개발비는 정부 출연금이 100퍼센트이고 참여 기업은 없습니다 (발표자료 슬라이드 2).

