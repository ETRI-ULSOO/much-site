# 발표자료 영상 19편 — 종료평가 발표자료에서 뽑아낸 원본을 ffprobe로 실측했고(2026-09-10),
# 각 영상이 실린 슬라이드 번호를 발표자료 인벤토리와 대조했습니다 (2026-09-11).
#
# ── 이 파일의 목적 ───────────────────────────────────────────────────────────
# 사용자가 "발표자료에 있는 동영상도 최대한 활용"할 것을 요청했습니다 (2026-09-11).
# 그래서 19편을 하나도 빠뜨리지 않고 등록하고, 각각 어느 페이지에 놓을지와
# 어떤 경로로 게시할지를 미리 정해 두었습니다.
#
# ── 필드 설명 ────────────────────────────────────────────────────────────────
# source      원본 파일 이름입니다. 원본은 저장소 밖(`docs/참조데이터/`)에 둡니다.
# slide       발표자료에서 이 영상이 실린 슬라이드 번호입니다.
# size_mb     원본 파일 크기입니다. 100MB를 넘는 파일은 저장소에 넣을 수 없습니다.
# duration_s  재생 길이(초), width·height 해상도, audio 오디오 트랙 유무입니다.
# place       사이트에서 이 영상을 놓을 페이지입니다.
# delivery    게시 경로입니다.
#               youtube     ETRI 공식 계정에 올리고 지연 로드 방식으로 불러옵니다.
#               self-clip   무음 짧은 발췌를 만들어 저장소에 직접 담습니다(5MB 이하).
#               oversize    원본이 너무 커서 저장소에 절대 넣지 않습니다. 게시는 유튜브로만 합니다.
# youtube     영상 ID입니다. 5단계에서 현행 사이트의 게시 영상과 대조해 채웁니다.
# confirmed   제목과 설명이 확인된 항목인지 여부입니다. false면 사용자 확인 전까지 게시하지 않습니다.
#
# ── 미해결 사항 (2026-09-11 기준) ────────────────────────────────────────────
# Q-3  영상을 어느 계정에 올릴지 정해지지 않았습니다. 선행 과제 CHIC의 영상이 개인 계정에
#      올라가 있어 과제 종료 뒤 관리가 끊길 위험이 있으므로, ETRI 공식 계정 사용을 확인해야 합니다.
# 슬라이드 16~31은 발표자료에 "연구내용 상세"라는 제목만 있고 내용이 전부 이미지 안에 있습니다.
#      그래서 그 구간 영상 13편(media3~media15)의 제목은 추정한 것이며, 사용자 확인이 필요합니다.
# media2(2,732MB)와 media15(1,051MB)는 어떤 경로로도 저장소에 넣지 않습니다.

