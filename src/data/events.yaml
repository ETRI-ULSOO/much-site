- id: expo-2025
  kind: exhibition
  year: 2025
  date: 2025-09
  ko:
    title: 2025 박물관·미술관 박람회 협력 전시와 콜로키움
    venue: ""
    desc: >-
      수요기관인 국립중앙박물관과 함께 박람회 안에 협력 전시 부스를 열어
      일반 관람객에게 연구 결과물을 공개했고, 박물관 관계자를 대상으로 콜로키움을 진행했습니다.
