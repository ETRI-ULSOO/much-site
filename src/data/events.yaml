#
# kind: colloquium(콜로키움), exhibition(전시·박람회), international(국제 협력),
#       cooperation(기관 협력·기술 이전)
#
# 2026-09-11 보강: 사용자가 제공한 최종보고서 70·76쪽에서 네 항목을 새로 확인해 더했습니다.
#   World IT Show 기술사업화 페스티벌(2025-04), 국립중앙도서관 업무협약(2025-05),
#   국립중앙도서관 기술 이전(2026-01-26), 박람회 협력 전시의 개최 시점(2025-09).

- id: colloquium-2024
  kind: colloquium
  date: 2024-09-10
  ko:
    title: 2024 지능형 헤리티지 콜로키움
    venue: 경주 화백컨벤션센터
    desc: >-
      문화유산 분야 종사자들과 함께 문화유산을 디지털로 바꾸어야 하는 이유를 공유하고,
      인문학의 관점과 공학의 관점에서 디지털 데이터에 접근하는 방법과 해석을 서로 이해하는 자리였습니다.
  en:
    title: "2024 Intelligent Heritage Colloquium"
    venue: "Hwabaek Convention Center, Gyeongju"
    desc: "An event where cultural heritage professionals shared why cultural heritage needs to be turned digital, and where participants came to understand each other's approaches and interpretations of digital data from both the humanities and engineering perspectives."

- id: colloquium-2025
  kind: colloquium
  date: 2025-09-05
  ko:
    title: 2025 공존과 지속 콜로키움
    venue: 광주 김대중컨벤션센터
    desc: 문화유산의 디지털 전환을 주제로 연구자와 현장 실무자가 함께 논의한 두 번째 콜로키움입니다.
  en:
    title: "2025 Coexistence and Sustainability Colloquium"
    venue: "Kim Dae-jung Convention Center, Gwangju"
    desc: "The second colloquium, where researchers and field practitioners discussed the digital transformation of cultural heritage."

- id: expo-2024
  kind: exhibition
  year: 2024
