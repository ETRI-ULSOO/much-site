# 수상 실적 — 종료평가 발표자료 슬라이드 42·45의 원문과
# 현행 사이트 News 페이지의 Award 항목을 대조했습니다 (2026-09-11).
#
# 현행 사이트의 오탈자 두 곳을 바로잡았습니다 (SITE-ANALYSIS 오류 3번).
#   "Communication Desing" → "Communication Design"
#   "콘텐츠가세계" → "콘텐츠가 세계" (띄어쓰기)
#
# 미해결 (2026-09-11 기준, SITE-ANALYSIS 오류 8번):
#   현행 사이트의 수상 페이지는 IDEA 수상의 공동연구기관으로 TRIC(문화유산기술연구소)을 적고 있으나
#   컨소시엄 페이지에는 TRIC이 없습니다. 어느 쪽이 맞는지 사용자에게 확인해야 하므로,
#   partners 항목에 TRIC을 적어 두되 확인 전까지는 화면에 내보내지 않습니다.
#
# 파일 형태 (2026-09-11 4단계): 최상위가 항목 배열이다. 콘텐츠 컬렉션의 file 로더가 배열 항목의 id를
#   열쇠로 쓰기 때문이며, 발표자료 슬라이드 42의 요약문은 src/content/ko/much/awards.mdx의 요약 절로 옮겼다.

