# 언론 보도.
#
# 2026-09-11: 현행 사이트 News 페이지의 Media 항목 9건을 매체 이름만 옮겨 두었습니다.
# 2026-09-14 보강: 아래 두 원천으로 항목을 채웠습니다.
#   ① 방송 7건: 현행 사이트 Media 쪽에 임베드된 유튜브 영상 7편의 ID를 확인하고, YouTube oEmbed와 watch 쪽에서
#      제목·채널·게시일·길이를 실측했습니다. date는 유튜브 게시일(한국 시간으로 환산)이며 방송 일자와 다를 수 있습니다.
#      방송사 저작물이므로 사이트에 임베드하지 않고 유튜브 링크(url)로만 안내합니다. youtube 필드는 ID 보관용이며
#      임베드 여부는 사용자 확인 뒤에 정합니다.
#   ② 신문·웹 기사 5건: 최종보고서 70쪽 "언론 보도" 표(캡션만 추출됨 — 국립중앙박물관 보도 25.07, 표준 가이드라인 공개
#      관련 보도 25.07, ETRI 웹진 25.08, ZDNet 문화유산 시리즈 25.08)를 단서로 웹에서 기사를 찾아 본문을 확인했습니다.
#      - ETRI 웹진은 보고서 캡션이 "25.08"이나 실측한 기사는 2024년 8월호(Vol.242)입니다. 2025년 8월호에서는 해당 기사를
#        찾지 못했으므로 연월 불일치를 사용자 확인 항목으로 남깁니다.
#      - ZDNet 시리즈 가운데 2025년 8월의 ETRI 편은 검색으로 찾지 못했고, 2025-07-10의 국립중앙박물관 편(㉑)에서
#        ETRI와 가이드라인 언급을 확인해 그 기사를 실었습니다.
#   ③ 충청투데이·디지털타임스는 기사 주소를 찾지 못해 ready: false로 남깁니다 (사용자 확인 항목).
#   ④ en.title은 초안 번역입니다 (사용자 검수 항목). 방송 항목의 ko.title은 유튜브 제목에서 매체 표기와 날짜를 뗀 것입니다.
#
# 미해결 Q-4 (2026-09-14 기준): 종료평가 발표자료의 "20여 회" 가운데 12건을 확인했습니다. 나머지는 사용자 제공을 기다립니다.
#
# 필드: outlet(ko/en) · ready · date(YYYY-MM-DD, 문자열) · url · youtube(방송 영상 ID, 보관용) · ko/en.title

