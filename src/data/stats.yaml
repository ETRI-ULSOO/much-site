# MUCH 정량 성과 — 최종보고서의 정량적 연구개발성과표(69쪽)를 실측해 옮겼습니다 (2026-09-11 대조).
#
# 원천이 바뀌었습니다. 처음에는 종료평가 발표자료(2026-04-09)의 성과표를 옮겼으나,
# 사용자가 2026-09-11에 제공한 최종보고서(2026-05-11 최종본)가 더 나중에 확정된 값이므로
# 그쪽을 따릅니다. 두 자료가 어긋난 항목은 두 곳입니다.
#   학술대회 발표: 발표자료 16건 → 최종보고서 18건
#   프로그램 등록: 발표자료 6건 → 최종보고서 7건
# 최종보고서 5쪽의 등록·기탁 건수(논문 29 · 특허 6 · 소프트웨어 7 · 표준 1)와도 들어맞습니다.
#   논문 29편 = SCOPUS 등재 국제학술대회 9 + SCI/E 학술지 2 + 기타 국내외 학술대회 18
#
# target: 협약 목표치, actual: 최종 실적. 목표치가 정해지지 않은 항목은 target을 생략합니다.
# highlight: 홈 화면의 숫자 띠에 올릴 항목인지 여부입니다.
#
# 정정 (2026-09-14): 별첨 5의 논문 PDF 29편을 실측한 결과 SCOPUS 9편은 전부 국제 학술대회 논문이었습니다.
#   2026-09-11 판은 이를 학술지 논문으로 오해해 paper-total을 "학술지 논문 11편"으로 적었으나,
#   보고서 69쪽의 항목 이름(SCOPUS 등재 국제학술대회 논문 / SCI/E 논문 / 기타 국내외 학술대회 논문)을 그대로 씁니다.
#   실제 학술지 논문은 SCI 2편 + 국내 학술지(박물관 보존과학) 2편 = 4편이고, 뒤의 2편은 보고서의 '기타 18편'에 들어 있습니다.
#   실측한 SCOPUS 후보는 10편으로 보고서의 9편보다 1편 많습니다 (papers.yaml 주석 참고, 사용자 확인 항목).
#   국제 특허는 목표 2건에 등록 실적이 0건이고 2건이 출원 진행 중이므로,
#   홈 화면의 숫자 띠에서는 실적으로 세지 않습니다.

